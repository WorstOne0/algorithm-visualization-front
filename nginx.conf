# Serves the Next static export. A route like /sorting/quick-sort is the file sorting/quick-sort.html.
server {
  listen 5002;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The build writes the link card as a file with no extension; scrapers need a real image type.
  location = /opengraph-image {
    default_type image/png;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
